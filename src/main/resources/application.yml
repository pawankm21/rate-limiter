spring:
  application:
    name: rate-limiter-service
  data:
    redis:
      host: localhost
      port: 6379
  datasource:
    url: jdbc:sqlite:./rate-limiter.db
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: posts-service
              uri: http://localhost:8081
              predicates:
                - Path=/posts/{userId}
                - Method=GET,POST
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@clientKeyResolver}"
                    redis-rate-limiter:
                      replenishRate: 1
                      burstCapacity: 10
                      requestedTokens: 1
