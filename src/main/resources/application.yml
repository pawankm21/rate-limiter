spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: posts-service
              uri: http://localhost:8081
              predicates:
                - Path=/posts/{userId}
                - Method=GET,POST
              filters:
                # ------------------------------------------------------------------
                # Option A (commented out): Spring Cloud Gateway's built-in Redis limiter.
                # State lives in Redis, so it is shared across gateway instances.
                # To use: set rate-limiter.algorithm=redis and ensure numericClientKeyResolver is the key-resolver.
                # ------------------------------------------------------------------
                # - name: RequestRateLimiter
                #                  args:
                #                    key-resolver: "#{@clientKeyResolver}"
                #                    redis-rate-limiter:
                #                      replenishRate: 1
                #                      burstCapacity: 10
                #                      requestedTokens: 1

                # ------------------------------------------------------------------
                # Option B (active): Custom rate limiter with configured algorithm.
                # Uses the custom TokenBucketCounter adapter (Redis, In-Memory, or Redisson).
                # key-resolver must produce a numeric client id (use @numericClientKeyResolver).
                # Configure rate-limiter.algorithm: in-memory | redis | redisson
                # ------------------------------------------------------------------
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@numericClientKeyResolver}"
                    custom-rate-limiter:
                      requestedTokens: 1

                # ------------------------------------------------------------------
                # Option C (alternative): Spring Cloud Gateway's built-in RedisRateLimiter.
                # Uncomment below and comment out Option B, and set rate-limiter.algorithm=redis.
                # ------------------------------------------------------------------
#                - name: RequestRateLimiter
#                  args:
#                    key-resolver: "#{@clientKeyResolver}"
#                    redis-rate-limiter:
#                      replenishRate: 1
#                      burstCapacity: 10
#                      requestedTokens: 1