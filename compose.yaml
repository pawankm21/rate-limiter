services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 15

  posts-mock:
    image: hashicorp/http-echo:1.0.0
    command: ["-listen=:5678", "-text=mock posts service"]
    ports:
      - "8081:5678"
